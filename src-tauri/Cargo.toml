[package]
name = "ruey-video-editor"
version = "0.1.0"
description = "RueyMediaEditor - an open-source desktop video editor"
authors = ["RueyMediaEditor contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ruey_video_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
flate2 = "1"
regex = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
